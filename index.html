<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Route Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?			family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "TikTok Sans", sans-serif;
    }

    .window-div {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-container {
      width: 100%;
      height: 80%;
      z-index: 1;
      flex-grow: 1;
    }

    .header-bar {
      height: 7vh;
      overflow: auto;
      background-color: #2C5530;
      color: white;
      width: 100%;
      align-items: center;
      z-index: 2;
      justify-content: center;
      display: flex;
      font-weight: bold;
      font-size: clamp(1rem, 2vw + 1rem, 3rem);
    }

    .lower-bar {
      background-color: #D38B5D;
      color: white;
      justify-content: center;
      z-index: 2;
      height: fit-content;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding-top: 1vh;
      padding-bottom: 2vh;
      align-content: center;
    }

    .text-entry {
      text-align: center;
      padding-bottom: 2vh;
      height: fit-content;
      display: flex;
      flex-direction: row;
      align-content: center;
      justify-content: center;
      padding-right: 1vw;
      padding-left: 1vw;
    }

    input {
      color: black;
      margin-bottom: 2px;
    }

    .btn-primary,
    .btn-primary:active,
    .btn-primary:focus {
      background-color: #739E82;
      border: 0;
    }

    .btn-primary:hover,
    .btn-primary:active,
    .btn-primary:active:focus {
      background-color: #2C5530 !important;
    }

    .h4-custom {
      font-size: 1.2em;
      font-weight: bold;
    }

    label {
      font-size: 1em;
      font-weight: normal;
    }

    input[type="radio"]:checked,
    input[type="checkbox"]:checked {
      accent-color: black;
    }

    .input-box,
    .radio-box {
      padding-bottom: 1vh;
      flex-direction: row;
      display: inline-block;
      padding-inline: 1vw;
    }

    .radio-box {
      flex-direction: column;
    }

    .radio-subbox {
      display: flex;
      flex-direction: row;
    }

    .input-column {
      flex-direction: column;
      display: flex;
    }

    .radio-label {
      padding-left: 1vw;
    }

    .length {
      font-weight: bold;
    }

    @media (orientation: portrait) {

      .input-box,
      .radio-box {
        display: flex;
        flex-direction: column;
        padding-bottom: 1vh;
        align-content: center;
        justify-content: center;
        align-items: center;
      }

      .text-entry {
        flex-direction: column;
      }

      .radio-box {
        flex-direction: row;
      }
    }
  </style>
</head>

<body>
  <div class="window-div">
    <div class="header-bar">Pedestrian Route Generator</div>
    <div class="map-container">
      <div id="map"></div>
    </div>
    <div class="lower-bar">
      <p class="h4-custom">Route Specifications</p>
      <div class="text-entry">
        <div class="input-box">
          <label for="startlat">Coordinates (Lat/Long):</label>
          <div class="input-column">
            <input type="number" id="startlat" name="startlat">
            <input type="number" id="startlon" name="startlon">
          </div>
        </div>
        <div class="input-box">
          <label for="distance">Distance Goal (miles):</label>
          <div>
            <input type="number" id="distance" name="distance">
          </div>
        </div>
        <div class="radio-box">
          <label>Route Type:</label>
          <div class="radio-subbox">
            <div class="radio-label">
              <input type="radio" id="type-oneway" name="type" value="oneway">
              <label for="type">One Way</label>
            </div>
            <div class="radio-label">
              <input type="radio" id="type-loop" name="type" value="loop">
              <label for="type">Loop</label>
            </div>
          </div>
        </div>
        <div class="radio-label">
          <label for="highway">Route Complexity (Loop Only):</label>
          <input type="range" min="1" max="5" id="complex" name="complex" value="complex">
        </div>
      </div>
      <div>
        <p class="length" id="actualLength"></p>
        <p class="length" id="elevationChange"></p>
      </div>
      <button id="submit" class="btn btn-primary" type="button">Calculate Route</button>
    </div>
  </div>
  <script>

    // MapBox Tile Setup
    mapboxgl.accessToken = 'pk.eyJ1IjoiZ3JlZ2Frb2hsZXIiLCJhIjoiY21oNmNteHM3MGlueDJrcTJnYnhrNG1hdSJ9.Jms57i-_QvRWoquaAuy-1A';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/gregakohler/cmh56515s00x301qocqgl025n',
      center: [-93.2010, 44.9375],
      zoom: 10
    });

    // Load arrow image
    map.loadImage('https://cdn-icons-png.flaticon.com/256/3916/3916837.png', (error, image) => {
      if (error) throw error;
      if (!map.hasImage('arrow-icon')) {
        map.addImage('arrow-icon', image);
      }
    });

    // API Key for OpenRouteService
    const ORS_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImEyNjk3YjQ5M2QwNTRjZTNiZTZiNzJkZDY5NmM4Y2E0IiwiaCI6Im11cm11cjY0In0=';

    // Function to call OpenRouteService API
    // Updated callORS to use subset
    async function callORS(coordinates) {
      const requestBody = {
        coordinates,
        elevation: coordinates.length < 10,
        format: 'geojson',
        options: {}
      };

      const response = await fetch('https://api.openrouteservice.org/v2/directions/foot-walking/geojson', {
        method: 'POST',
        headers: {
          'Authorization': ORS_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
      });

      // Handle specific ORS errors
      if (response.status === 429) {
        const retryAfter = response.headers.get("Retry-After") || 3;
        throw { type: "rateLimit", retryAfter: Number(retryAfter) };
      }

      if (!response.ok) {
        console.error(`ORS error: ${response.status} ${response.statusText}`);
        throw new Error(`ORS failed: ${response.status}`);
      }

      const data = await response.json();
      return data;
    }


    // Generate random destination point
    function randomDestination(startLat, startLon, distanceMiles) {
      // Convert latitude/longitude degrees per mile
      const milesPerDegreeLat = 110.574 / 1.60934;
      const milesPerDegreeLon = (111.320 / 1.60934) * Math.cos(startLat * Math.PI / 180);

      // Random angle away from start in radians
      const randomAngle = Math.random() * 2 * Math.PI;

      // Offsets in miles
      const deltaLat = (Math.sin(randomAngle) * distanceMiles) / milesPerDegreeLat;
      const deltaLon = (Math.cos(randomAngle) * distanceMiles) / milesPerDegreeLon;
      console.log("Random Point:", [startLon + deltaLon, startLat + deltaLat])

      // Return random point coordinates
      return [startLon + deltaLon, startLat + deltaLat];
    }

    function generateLoopWaypointsEnhanced(startLat, startLon, targetDistanceMiles, routeComplex) {
      const points = (2 + routeComplex * 2)
      const presets = {
        1: { radiusExtra: 0.5, randomness: 0.05 },
        2: { radiusExtra: 0.7, randomness: 0.08 },
        3: { radiusExtra: 1.0, randomness: 0.12 },
        4: { radiusExtra: 1.3, randomness: 0.18 },
        5: { radiusExtra: 1.6, randomness: 0.25 }
      };
      const preset = presets[routeComplex] || presets[2];
      const { radiusExtra, randomness } = preset;
      const radius = (targetDistanceMiles / loopPoints) * preset.radiusFactor * (1.3 + 0.1 * routeComplex);
      const randomAngle = Math.random() * 2 * Math.PI;
      const waypoints = [];

      for (let i = 0; i < points; i++) {
        const angle = randomAngle + (i * (Math.PI * 1.6 / points)) + ((Math.random() - 0.5) * randomness);
        const localRadius = radius * (0.9 + Math.random() * 0.2);
        const latOffset = (localRadius / 69) * Math.cos(angle);
        const lonOffset = (localRadius / (69 * Math.cos(startLat * Math.PI / 180))) * Math.sin(angle);
        const bias = 0.1 * routeComplex;
        const lon = startLon + lonOffset * (1 - bias);
        const lat = startLat + latOffset * (1 - bias);
        waypoints.push([lon, lat]);
      }
      return waypoints;
    }

    // Generate a loop of waypoints
    function generateLoopWaypointsNonOverlapping(startLat, startLon, distanceMiles, loopPoints) {
      const radius = Math.min(distanceMiles / loopPoints, 10); // no segment longer than ~10 miles
      const waypoints = [];

      // Random angle away from start in radians
      const randomAngle = Math.random() * 2 * Math.PI;

      for (let i = 0; i < loopPoints; i++) {
        // Spread points around the circle but not symmetrically
        const randomness = (loopPoints / 2) > 5 ? 0.05 : 0.2;
        const angle = randomAngle + (i * (Math.PI * 1.2 / loopPoints)) + (Math.random() * randomness);
        const latOffset = (radius / 69) * Math.cos(angle); // ~69 miles per degree latitude
        const lonOffset = (radius / (69 * Math.cos(startLat * Math.PI / 180))) * Math.sin(angle);
        waypoints.push([startLon + lonOffset, startLat + latOffset]);
      }
      return waypoints;
    }

    // Main function to generate route to match target distance
    async function generateRouteToMatchDistance(startLat, startLon, targetDistanceMiles, routeType, routeComplex) {
      const loopPoints = (routeComplex * 2);
      let estimatedMiles = routeType === 'loop'
        ? targetDistanceMiles / (loopPoints * 2)
        : targetDistanceMiles;

      let routeDifferenceMiles = Infinity;
      let attemptCount = 0;
      const maxAttempts = Math.min(5 + routeComplex, 8);
      let routeJSON = null;

      while (routeDifferenceMiles > (targetDistanceMiles * 0.1) && attemptCount < maxAttempts) {
        let routeCoordinates;
        if (routeType === 'loop') {
          const loopWaypoints = generateLoopWaypointsEnhanced(startLat, startLon, targetDistanceMiles, loopPoints);
          routeCoordinates = [
            [Number(startLon), Number(startLat)],
            ...loopWaypoints.map(p => p.map(Number)),
            [Number(startLon), Number(startLat)]
          ];
        } else {
          const randomPoint = randomDestination(startLat, startLon, estimatedMiles);
          routeCoordinates = [
            [Number(startLon), Number(startLat)],
            randomPoint.map(Number)
          ];
        }

        try {
          const orsResponse = await callORS(routeCoordinates);

          if (!orsResponse?.features?.length) {
            console.warn("No route returned. Trying again.");
            attemptCount++;
            continue;
          }

          const route = orsResponse.features[0];
          const actualRouteMiles = route.properties.summary.distance / 1609.34;
          routeDifferenceMiles = Math.abs(actualRouteMiles - targetDistanceMiles);
          console.log(`Attempt ${attemptCount + 1}: ${actualRouteMiles.toFixed(2)} mi (target ${targetDistanceMiles})`);

          estimatedMiles *= targetDistanceMiles / actualRouteMiles;
          routeJSON = route;
          attemptCount++;

          // Small throttle to avoid rate limit
          await new Promise(r => setTimeout(r, 800));

        } catch (error) {
          if (error.type === "rateLimit") {
            console.warn(`Rate limited. Waiting ${error.retryAfter}s before retry`);
            await new Promise(r => setTimeout(r, error.retryAfter * 1000));
            continue;
          } else {
            console.erroror("ORS request failed:", error);
            attemptCount++;
            await new Promise(r => setTimeout(r, 1000));
            continue;
          }
        }
      }

      return routeJSON;
    }


    // Add generated route to map
    function displayRouteOnMap(routeGeoJSON) {
      if (!routeGeoJSON) return;

      // Remove previous route + arrows if they exist
      if (map.getLayer('route-arrows')) {
        map.removeLayer('route-arrows');
      }
      if (map.getLayer('route')) {
        map.removeLayer('route');
        map.removeSource('route');
      }

      // Add new route source + main line
      map.addSource('route', { type: 'geojson', data: routeGeoJSON });
      map.addLayer({
        id: 'route',
        type: 'line',
        source: 'route',
        paint: {
          'line-color': '#1E5599',
          'line-width': 4
        }
      });

      // Add direction arrows
      map.addLayer({
        id: 'route-arrows',
        type: 'symbol',
        source: 'route',
        layout: {
          'symbol-placement': 'line',
          'symbol-spacing': 22,
          'icon-image': 'arrow-icon',
          'icon-size': 0.2,
          'icon-rotate': 180
        }
      });

      // Fit map to route
      const coords = routeGeoJSON.geometry.coordinates;
      const bounds = coords.reduce(
        (b, coord) => b.extend(coord),
        new mapboxgl.LngLatBounds(coords[0], coords[0])
      );
      map.fitBounds(bounds, { padding: 50 });

      // Add mile markers
      addMileMarkers(map, routeGeoJSON);
    }

    // Add mile markers along the route
    function addMileMarkers(map, routeGeoJSON) {
      if (!routeGeoJSON || !routeGeoJSON.geometry || !routeGeoJSON.geometry.coordinates) return;

      const coords = routeGeoJSON.geometry.coordinates;
      const totalMiles = turf.length(routeGeoJSON, { units: 'miles' });

      const mileMarkers = {
        type: "FeatureCollection",
        features: []
      };

      let accumulated = 0;
      let targetMiles = 1;

      for (let i = 1; i < coords.length; i++) {
        const [lon1, lat1] = coords[i - 1];
        const [lon2, lat2] = coords[i];

        // Segment distance in miles
        const segmentMiles = turf.distance([lon1, lat1], [lon2, lat2], { units: 'miles' });
        accumulated += segmentMiles;

        if (accumulated >= targetMiles) {
          const ratio = (targetMiles - (accumulated - segmentMiles)) / segmentMiles;
          const lon = lon1 + (lon2 - lon1) * ratio;
          const lat = lat1 + (lat2 - lat1) * ratio;

          mileMarkers.features.push({
            type: "Feature",
            geometry: { type: "Point", coordinates: [lon, lat] },
            properties: { label: `${targetMiles}` }
          });

          targetMiles += 1;
        }
      }

      if (map.getSource('mile-markers')) {
        map.removeLayer('mile-marker-labels');
        map.removeSource('mile-markers');
      }

      map.addSource('mile-markers', { type: 'geojson', data: mileMarkers });
      map.addLayer({
        id: 'mile-marker-labels',
        type: 'symbol',
        source: 'mile-markers',
        layout: {
          'text-field': ['get', 'label'],
          'text-size': 18,
          'text-padding': 8,
          'text-anchor': 'center',
          'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
          'text-justify': 'center'
        },
        paint: {
          'text-color': '#000',
          'text-halo-color': '#fff',
          'text-halo-width': 8,
          'text-halo-blur': 3
        }
      });
    }

    function calculateElevation(coordsData) {
      if (!coordsData || coordsData.length < 2) return 0;
      console.log("Start Elev:", coordsData[0][2]);
      console.log("End Elev:", coordsData[coordsData.length - 1][2]);

      // Take every 3rd point to reduce noise
      const step = 3;
      const smoothed = coordsData.filter((_, i) => i % step === 0);

      let totalGain = 0;

      for (let i = 1; i < smoothed.length; i++) {
        const previous = smoothed[i - 1][2];
        const current = smoothed[i][2];
        const difference = current - previous;

        // Only add uphill elevation gain
        if (difference > 0) totalGain += difference;
      }

      // Convert Meters to Feet
      const meterToFeet = 3.28084;
      totalGain *= meterToFeet;
      return totalGain.toFixed(0); // nearest whole foot
    }



    // Actual Running of Script

    // Add current location tool
    var currentloc = new mapboxgl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true
      },
      trackUserLocation: true
    });
    map.addControl(currentloc);
    let startMarker = null;
    let endMarker = null;

    // Get current coords and add to form and marker
    currentloc.on('geolocate', (event) => {
      var currentLat = event.coords.latitude;
      var currentLon = event.coords.longitude;
      console.log(`Geolocate Coords: ${currentLat} & ${currentLon}`);
      document.getElementById('startlat').value = currentLat;
      document.getElementById('startlon').value = currentLon;
      if (startMarker !== null) {
        startMarker.remove();
      }

      startMarker = new mapboxgl.Marker()
        .setLngLat([currentLon, currentLat])
        .addTo(map);
    });

    // Get coords based on click
    map.on('click', (event) => {
      var clickcoords = event.lngLat;
      var currentLat = clickcoords.lat;
      var currentLon = clickcoords.lng;
      console.log(`Clicked Coords: ${currentLat} & ${currentLon}`);
      document.getElementById('startlat').value = currentLat;
      document.getElementById('startlon').value = currentLon;
      if (startMarker !== null) {
        startMarker.remove();
      }
      startMarker = new mapboxgl.Marker()
        .setLngLat([currentLon, currentLat])
        .addTo(map);
      map.flyTo({
        center: [currentLon, currentLat],
        zoom: 11,
        essential: true
      })
    });

    // Get calculate button
    const submitButton = document.getElementById('submit');

    // Action after submit button
    submitButton.addEventListener('click', async () => {
      console.log("Submit Button Clicked")
      const latInput = Number(document.getElementById('startlat').value);
      const lonInput = Number(document.getElementById('startlon').value);
      const targetDistance = parseFloat(document.getElementById('distance').value);
      const routeType = document.querySelector('input[name="type"]:checked').value;
      const routeComplex = document.getElementById('complex').value;
      console.log("Route Complex: " + routeComplex)
      const actualLengthElem = document.getElementById("actualLength");
      const elevChangeElem = document.getElementById("elevationChange");
      if (startMarker !== null) {
        startMarker.remove();
      }
      // Remove end waypoint if present
      if (endMarker !== null) {
        endMarker.remove();
      }
      console.log(`Coordinates Submitted: ${latInput} & ${lonInput}`)
      startMarker = new mapboxgl.Marker()
        .setLngLat([lonInput, latInput])
        .addTo(map);

      const routeGeoJSON = await generateRouteToMatchDistance(latInput, lonInput, targetDistance, routeType, routeComplex);
      const coordData = routeGeoJSON.geometry.coordinates;
      const endCoords = coordData[coordData.length - 1];
      const elevationGain = calculateElevation(coordData);
      const routeLength = routeGeoJSON.properties.summary.distance / 1609.34;
      displayRouteOnMap(routeGeoJSON);
      // Add end waypoint if needed
      if (routeType != 'loop') {
        endMarker = new mapboxgl.Marker({ color: 'orange' })
          .setLngLat([endCoords[0], endCoords[1]])
          .addTo(map);
      }
      console.log(routeLength);
      console.log(elevationGain);
      // Change actual route length value
      actualLengthElem.textContent = "Route Length: " + routeLength;
      elevChangeElem.textContent = "Elevation Gain: " + elevationGain + " feet";
    });

  </script>
</body>

</html>
